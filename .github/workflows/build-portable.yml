name: Build AI Content Studio for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: x64
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild native SQLite module
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build application
        run: npm run build

      - name: Build installer and portable EXE
        if: startsWith(github.ref, 'refs/tags/')
        run: npx electron-builder --win nsis portable --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer and portable EXE (non-release)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: AI-Content-Studio-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
