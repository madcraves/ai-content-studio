name: Build AI Content Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: x64
          cache: npm

      - name: Show Node and npm Versions
        run: |
          node --version
          npm --version

      - name: Install Project Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows Installer
        run: npm run dist

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: AI-Content-Studio-Windows-Installer-x64
          path: release/AI-Content-Studio-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 14
