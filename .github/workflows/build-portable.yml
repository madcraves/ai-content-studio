name: Build AI Content Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Portable Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: x64
          cache: npm

      - name: Show Node and npm Versions
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Portable Windows EXE
        run: npm run make:portable

      - name: Upload Portable Application
        uses: actions/upload-artifact@v4
        with:
          name: AI-Content-Studio-Portable-Windows-x64
          path: release/portable/*.exe
          if-no-files-found: error
          retention-days: 14
