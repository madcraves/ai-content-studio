name: Build AI Content Studio Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: windows-installer-release
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          architecture: x64

      - name: Show Node and npm Versions
        run: |
          node --version
          npm --version

      - name: Set release version
        shell: bash
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version

      - name: Install Project Dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Download Electron Binary (mirror fallback + retry)
        shell: pwsh
        run: |
          $mirrors = @(
            "https://npmmirror.com/mirrors/electron/",
            "https://github.com/electron/electron/releases/download/"
          )
          $maxAttempts = 3
          $downloaded = $false

          foreach ($mirror in $mirrors) {
            $env:ELECTRON_MIRROR = $mirror
            Write-Host "Trying Electron mirror: $mirror"

            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              Write-Host "Download attempt $attempt of $maxAttempts..."
              node node_modules/electron/install.js
              if ($LASTEXITCODE -eq 0) {
                Write-Host "Electron binary downloaded successfully from $mirror"
                $downloaded = $true
                break
              }

              if ($attempt -lt $maxAttempts) {
                $delay = 15 * $attempt
                Write-Warning "Download failed (exit $LASTEXITCODE). Retrying in $delay seconds..."
                Start-Sleep -Seconds $delay
              }
            }

            if ($downloaded) { break }
            Write-Warning "Mirror failed; trying the next source."
          }

          Remove-Item Env:ELECTRON_MIRROR -ErrorAction SilentlyContinue
          if (-not $downloaded) {
            throw "Electron binary download failed from all configured mirrors."
          }

      - name: Rebuild Native Dependencies
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build React Application
        run: npm run build

      - name: Build Electron TypeScript
        run: npx tsc -p electron/tsconfig.json

      - name: Create Windows Installer
        run: npm run make:installer

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: AI-Content-Studio-Windows-Installer-x64
          path: |
            release/installer/*.exe
            release/installer/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for Auto Updates
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AI Content Studio v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            release/installer/*
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
