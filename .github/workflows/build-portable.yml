name: Build AI Content Studio Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: x64

      - name: Show Node and npm Versions
        run: |
          node --version
          npm --version

      - name: Install Project Dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild Native Dependencies
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build React Application
        run: npm run build

      - name: Build Electron TypeScript
        run: npx tsc -p electron/tsconfig.json

      - name: Create Windows Installer
        run: npm run make:installer

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: AI-Content-Studio-Windows-Installer-x64
          path: |
            release/installer/*.exe
            release/installer/*.blockmap
          if-no-files-found: error
          retention-days: 14
