name: Build AI Content Studio Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: windows-installer-release
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          architecture: x64

      - name: Show Node and npm Versions
        run: |
          node --version
          npm --version

      - name: Set release version
        shell: bash
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version

      - name: Install Project Dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Download Electron Binary (with retry)
        shell: pwsh
        run: |
          $maxAttempts = 6
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Downloading Electron binary (attempt $attempt of $maxAttempts)..."
            node node_modules/electron/install.js
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Electron binary downloaded successfully."
              break
            }
            if ($attempt -eq $maxAttempts) {
              throw "Electron binary download failed after $maxAttempts attempts."
            }
            $delay = [Math]::Min(60, 10 * $attempt)
            Write-Warning "Electron download failed (exit $LASTEXITCODE). Retrying in $delay seconds..."
            Start-Sleep -Seconds $delay
          }

      - name: Rebuild Native Dependencies
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build React Application
        run: npm run build

      - name: Build Electron TypeScript
        run: npx tsc -p electron/tsconfig.json

      - name: Create Windows Installer
        run: npm run make:installer

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: AI-Content-Studio-Windows-Installer-x64
          path: |
            release/installer/*.exe
            release/installer/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for Auto Updates
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AI Content Studio v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            release/installer/*
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
