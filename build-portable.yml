name: Build AI Content Studio Portable (Windows x64)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-portable:
    name: Build Windows x64 Portable
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js on GitHub runner only
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: x64
          package-manager-cache: false

      - name: Verify project file structure
        shell: pwsh
        run: |
          $required = @(
            'package.json',
            'electron/main.ts',
            'electron/preload.ts',
            'electron/tsconfig.json',
            'electron/services/database.ts',
            'electron/services/generation.ts',
            'electron/services/wordpress.ts',
            'electron/services/scheduler.ts'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              Write-Error "Missing required project file: $file"
            }
          }

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Build portable Windows x64 EXE
        run: npm run dist:portable

      - name: Upload portable EXE
        uses: actions/upload-artifact@v7
        with:
          name: AI-Content-Studio-Portable-Windows-x64
          path: release/portable/*.exe
          if-no-files-found: error
          retention-days: 30
